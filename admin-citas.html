<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citas de los usuarios · Administración · TurnoFácil Quibdó</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/logo-64.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="encabezado encabezado--admin" id="encabezado-admin"></header>
  <div class="contenedor admin-diseno">
    <nav class="admin-nav no-imprimir" id="admin-nav" aria-label="Secciones de administración"></nav>
    <main class="admin-contenido" id="contenido">
      <h1>Citas de los usuarios</h1>
      <p class="admin-subtitulo no-imprimir">Mira las citas por semana o en lista. Toca una cita para ver todos sus datos.</p>
      <div class="admin-barra">
        <div class="conmutador" role="group" aria-label="Forma de ver las citas">
          <button type="button" data-vista="semana" aria-pressed="true">Semana</button>
          <button type="button" data-vista="lista" aria-pressed="false">Lista</button>
        </div>
        <div class="campo">
          <label for="filtro-estado">Estado</label>
          <select id="filtro-estado"><option value="">Todos</option><option value="Programada">Programadas</option><option value="Cancelada">Canceladas</option></select>
        </div>
        <div class="campo">
          <label for="filtro-servicio">Servicio</label>
          <select id="filtro-servicio"><option value="">Todos</option></select>
        </div>
        <div class="campo">
          <label for="busqueda">Buscar</label>
          <input type="search" id="busqueda" placeholder="Nombre, cédula o código" autocomplete="off">
        </div>
      </div>
      <div id="vista-citas" aria-live="polite"></div>
    </main>
  </div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <script src="js/comun.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-citas.js"></script>
</body>
</html>
